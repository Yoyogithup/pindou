name: Consumer CI

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/consumer/**"
      - ".github/workflows/consumer-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/consumer/**"
      - ".github/workflows/consumer-ci.yml"

concurrency:
  group: consumer-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/consumer

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/consumer/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit and component tests
        run: npm test -- --runInBand

      - name: Run lint
        run: npm run lint

      - name: Build static application
        run: npm run build
